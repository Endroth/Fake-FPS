name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Dar permissão ao gradlew
        run: chmod +x gradlew

      - name: Compilar
        run: ./gradlew build

      - name: Enviar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: fpsfake-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
